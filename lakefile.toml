name = "ECCompute"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ECCompute"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "ECCompute"

[[lean_lib]]
name = "Curves"
# The curve defs and j-invariants carry very long integer literals; the long-line
# linter is pure noise on this library, so disable it here rather than per file.
leanOptions = { weak.linter.style.longLine = false }

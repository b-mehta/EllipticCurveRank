name = "ECCompute"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ECCompute"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "9ef14c7b82f8a45f8dfc03dace26d6bb25023bac"

[[lean_lib]]
name = "ECCompute"

name = "ECCompute"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ECCompute"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "ECCompute"

[[lean_lib]]
name = "Curves"
leanOptions = { weak.linter.style.longLine = false }

# Trusted statement module for the leanprover/comparator adversarial check of
# `curve302_hasRankGE_31`. Kept out of `defaultTargets` (and thus out of `mk_all`) so it never
# collides with the real `curve302` during a normal build; built on demand by comparator.
[[lean_lib]]
name = "Curve302Challenge"
srcDir = "comparator"

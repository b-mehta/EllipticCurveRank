name = "ECCompute"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ECCompute"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "2094f6de7955f83258617e202743892fcd7edf0c"

[[lean_lib]]
name = "ECCompute"

[[lean_lib]]
name = "Curves"
leanOptions = { weak.linter.style.longLine = false }

name = "ECCompute"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ECCompute"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "01cceef4309e0b28bde5dd951c72960f5282a1ac"

[[lean_lib]]
name = "ECCompute"

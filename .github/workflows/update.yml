# Keeps ECCompute's mathlib pin current and flags upstream breakage, using
# hopscotch-action (https://github.com/leanprover-community/hopscotch-action).
#
# The action bisects mathlib's commits itself, so ECCompute does not need to be
# registered anywhere. Two modes run each day:
#
#   last-good - open/update a bump PR advancing the pin to the last mathlib
#               commit that still builds, plus a tracking issue while a
#               regression is active (closed automatically on recovery).
#   first-bad - open a fix PR pinned to the first breaking commit, on a per-SHA
#               branch, so it can be `gh pr checkout`ed and fixed locally.
#
# The action is pinned to a main commit (e163305, 2026-05-25) rather than a tag:
# the `pin-to`/`pr-token` inputs the two modes below rely on were added on main
# and have not been cut into a release yet (latest tag v1.0.0 predates them).
# Bump to a released tag once one ships `pin-to`.
name: Update Dependencies

on:
  schedule:
    - cron: "0 18 * * *" # daily at 18:00 UTC
  workflow_dispatch:      # allow manual runs from the Actions tab

jobs:
  hopscotch:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push bump / fix branches
      pull-requests: write # open / update PRs
      issues: write        # open / close the tracking issue
    steps:
      - uses: actions/checkout@v7

      # Bump PR to the last passing mathlib commit, plus a tracking issue on breakage.
      - name: Bump to last good mathlib
        uses: leanprover-community/hopscotch-action@e163305f758acb4c1e77bbb357c258195aa9264a
        with:
          dependency: mathlib
          to: master
          pin-to: last-good
          # PAT so the bump PR triggers Lean Action CI; the default GITHUB_TOKEN
          # would not. If the secret is unset this is empty and the PR still opens
          # (just without CI running on it).
          pr-token: ${{ secrets.HOPSCOTCH_PAT }}

      # Fix PR pinned to the first breaking mathlib commit, for local reproduction.
      - name: Track first breaking mathlib commit
        uses: leanprover-community/hopscotch-action@e163305f758acb4c1e77bbb357c258195aa9264a
        with:
          dependency: mathlib
          to: master
          pin-to: first-bad
          pr-token: ${{ secrets.HOPSCOTCH_PAT }}

# Keeps ECCompute's mathlib pin current and flags upstream breakage, using
# hopscotch-action (https://github.com/leanprover-community/hopscotch-action).
#
# The action bisects mathlib's commits itself, so ECCompute does not need to be
# registered anywhere. Each day it advances the pin to the last mathlib commit
# that still builds, opening/updating a bump PR plus a tracking issue while a
# regression is active (closed automatically on recovery).
#
# The `pin-to: first-bad` fix-PR mode lives on the action's default branch, not
# the @v1 release, so this runs the single default (last-good) mode. Pin the
# action to a ref that ships `pin-to` to add the fix PR.
name: Update Dependencies

on:
  schedule:
    - cron: "0 18 * * *" # daily at 18:00 UTC
  workflow_dispatch:      # allow manual runs from the Actions tab

jobs:
  hopscotch:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push the bump branch
      pull-requests: write # open / update the PR
      issues: write        # open / close the tracking issue
    steps:
      - uses: actions/checkout@v7

      - name: Bump mathlib to the last passing commit
        uses: leanprover-community/hopscotch-action@v1
        with:
          dependency: mathlib
          to: master
          # A PAT so the bump PR triggers Lean Action CI; the default GITHUB_TOKEN
          # does not. Falls back to the job token if the secret is unset (the PR
          # still opens, without CI running on it).
          github-token: ${{ secrets.HOPSCOTCH_PAT || github.token }}
